name: Mobile CI

on:
  push:
    branches: [production, main]
  pull_request:
    branches: [production, main]

jobs:
  ci:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npx jest --watchman=false --ci
